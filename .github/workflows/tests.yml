name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        # No `playwright install chromium` here: the suite never launches a
        # browser, and downloading one would add minutes to every push.
        run: pip install -r requirements.txt

      - name: Run tests
        # The suite is stdlib unittest and needs no credentials - the engine
        # tests run against config/meal_templates.json, and the store tests
        # against a temporary SQLite file.
        run: python -m unittest discover -s src -p "test_*.py" -v
